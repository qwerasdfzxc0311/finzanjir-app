name: FINZANJIR v4 checks

on:
  push:
    branches:
      - finzanjir-v4-unified-workflow-uz
    paths:
      - "finzanjir_v4/**"
      - ".github/workflows/finzanjir-v4-checks.yml"
  pull_request:
    branches:
      - finzanjir-v4-unified-workflow-uz
    paths:
      - "finzanjir_v4/**"
      - ".github/workflows/finzanjir-v4-checks.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Compile v4 source
        run: python -m compileall -q finzanjir_v4
      - name: Streamlit UI smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("finzanjir_v4/app.py", default_timeout=30).run()
          if app.exception:
              raise AssertionError("\\n".join(str(item) for item in app.exception))
          assert len(app.radio) >= 1, "Main navigation was not rendered"
          assert any("Bosh sahifa" in str(item.value) for item in app.radio), "Public home page was not rendered"
          PY
      - name: Verify public interface is read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("finzanjir_v4/app.py").read_text(encoding="utf-8")
          forbidden = (
              "st.button(", "st.form(", "st.form_submit_button(",
              "st.text_area(", "st.session_state[", "sqlite3",
              "save_feedback(", "review_case("
          )
          found = [item for item in forbidden if item in source]
          assert not found, f"Public interface contains write-capable code: {found}"
          for layer_number in range(1, 17):
              assert f"L{layer_number:02d}" in source, f"Missing layer L{layer_number:02d}"
          print("Read-only source check passed; all 16 layer IDs are present.")
          PY
