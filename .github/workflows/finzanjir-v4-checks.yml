name: FINZANJIR v4 checks

on:
  push:
    branches:
      - finzanjir-v4-unified-workflow-uz
    paths:
      - "finzanjir_v4/**"
      - ".github/workflows/finzanjir-v4-checks.yml"
  pull_request:
    branches:
      - finzanjir-v4-unified-workflow-uz
    paths:
      - "finzanjir_v4/**"
      - ".github/workflows/finzanjir-v4-checks.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Compile v4 source
        run: python -m compileall -q finzanjir_v4
      - name: Streamlit UI smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("finzanjir_v4/app.py", default_timeout=20).run()
          if app.exception:
              raise AssertionError("\\n".join(str(item) for item in app.exception))
          assert len(app.radio) >= 1, "Main navigation radio was not rendered"
          assert any("Umumiy ko‘rinish" in str(item.value) for item in app.radio), "Dashboard page did not render"
          PY
