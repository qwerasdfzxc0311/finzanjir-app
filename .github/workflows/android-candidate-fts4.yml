name: FINZANJIR candidate Android FTS4 validation

on:
  workflow_dispatch:
  push:
    branches: [integrated-workflow-foundation-2026-11-10]
    paths:
      - 'app/**'
      - 'source-import/candidates/**'
      - 'tools/validate_merged_knowledge_fts4.py'
      - '.github/workflows/android-candidate-fts4.yml'
  pull_request:
    branches: [ai-core-lightweight-fts4-2026-11-10]
    paths:
      - 'app/**'
      - 'source-import/candidates/**'
      - 'tools/validate_merged_knowledge_fts4.py'
      - '.github/workflows/android-candidate-fts4.yml'

permissions:
  contents: read

jobs:
  candidate-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate 6,679-record corpus and FTS4 search aliases
        run: python tools/validate_merged_knowledge_fts4.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build isolated candidate APK
        run: gradle --no-daemon assembleCandidate

      - name: Run Android SQLite FTS4 instrumentation test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon connectedCandidateAndroidTest

      - name: Upload isolated candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: finzanjir-android-6679-fts4-candidate
          path: app/build/outputs/apk/candidate/app-candidate.apk
          if-no-files-found: error
          retention-days: 14
