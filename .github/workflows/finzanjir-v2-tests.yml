name: FINZANJIR prototype tests
on:
  push:
    paths:
      - "finzanjir_v2/**"
      - ".github/workflows/finzanjir-v2-tests.yml"
  pull_request:
    paths:
      - "finzanjir_v2/**"
      - ".github/workflows/finzanjir-v2-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "streamlit>=1.32,<2"
      - run: cd finzanjir_v2 && python -m unittest -v
